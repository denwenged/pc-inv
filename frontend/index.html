<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Build Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 font-sans">

    <div id="login-screen" class="fixed inset-0 bg-gray-900 flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-96">
            <h2 class="text-2xl font-bold mb-6 text-center text-blue-600">Gestión de Inventario</h2>
            <input type="text" id="username" placeholder="Usuario" class="w-full p-3 border rounded mb-4">
            <input type="password" id="password" placeholder="Contraseña" class="w-full p-3 border rounded mb-6">
            <button onclick="login()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700">Entrar</button>
        </div>
    </div>

    <div id="app" class="hidden">
        <nav class="bg-blue-700 text-white p-4 shadow-lg">
            <div class="container mx-auto flex justify-between items-center">
                <h1 class="text-xl font-bold">🖥️ PC Assembler Pro</h1>
                <div class="space-x-4">
                    <button onclick="showSection('inventario')" class="hover:underline">Inventario</button>
                    <button onclick="showSection('montar')" class="hover:underline">Montar PC</button>
                    <button onclick="showSection('ventas')" class="hover:underline">Ventas y Beneficios</button>
                    <button onclick="logout()" class="bg-red-500 px-3 py-1 rounded">Salir</button>
                </div>
            </div>
        </nav>

        <main class="container mx-auto p-6">
            
            <section id="inventario" class="section">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="bg-white p-6 rounded-lg shadow">
                        <h2 class="text-lg font-bold mb-4">Añadir Componente (Individual o Lote)</h2>
                        <div class="space-y-3">
                            <div class="relative">
                                <input type="text" id="comp-name" onkeyup="buscarInternet(this.value)" placeholder="Nombre (ej: RTX 3060)" class="w-full p-2 border rounded">
                                <div id="sugerencias" class="absolute bg-white border w-full hidden z-10 shadow-lg"></div>
                            </div>
                            <input type="text" id="comp-cat" placeholder="Categoría (GPU, CPU...)" class="w-full p-2 border rounded">
                            <div class="flex gap-2">
                                <input type="number" id="comp-qty" placeholder="Cantidad" class="w-1/2 p-2 border rounded" value="1">
                                <input type="number" id="comp-price" placeholder="Precio Unidad (€)" class="w-1/2 p-2 border rounded">
                            </div>
                            <button onclick="addBulk()" class="w-full bg-green-600 text-white py-2 rounded">Guardar en Inventario</button>
                        </div>
                    </div>

                    <div class="bg-white p-6 rounded-lg shadow border-l-4 border-orange-500">
                        <h2 class="text-lg font-bold mb-4">Añadir Pack (Bundle)</h2>
                        <p class="text-xs text-gray-500 mb-2 italic">Ejemplo: Compras Placa + CPU + RAM por un precio total.</p>
                        <textarea id="bundle-names" placeholder="Nombres separados por comas (Ej: Placa B450, Ryzen 5 3600)" class="w-full p-2 border rounded mb-3"></textarea>
                        <input type="number" id="bundle-total-price" placeholder="Precio Total del Pack (€)" class="w-full p-2 border rounded mb-3">
                        <button onclick="addBundle()" class="w-full bg-orange-500 text-white py-2 rounded">Añadir y Dividir Precio</button>
                    </div>
                </div>

                <div class="mt-8 bg-white p-6 rounded-lg shadow">
                    <h2 class="text-lg font-bold mb-4">Stock Disponible</h2>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead>
                                <tr class="border-b">
                                    <th class="p-2">ID</th>
                                    <th class="p-2">Nombre</th>
                                    <th class="p-2">Coste</th>
                                    <th class="p-2">Categoría</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-stock"></tbody>
                        </table>
                    </div>
                </div>
            </section>

            <!-- SECCIÓN: MONTAR PC -->
            <section id="montar" class="section hidden">
                <div class="bg-white p-6 rounded-lg shadow">
                    <h2 class="text-lg font-bold mb-4">Crear Proyecto de Montaje</h2>
                    <input type="text" id="pc-name" placeholder="Nombre del PC (ej: Gaming Red Beast)" class="w-full p-2 border rounded mb-4">
                    <h3 class="font-bold mb-2 text-sm">Selecciona los componentes del stock:</h3>
                    <div id="lista-seleccion-componentes" class="grid grid-cols-2 md:grid-cols-3 gap-2 mb-4 max-h-64 overflow-y-auto border p-2">
                        <!-- Se llena con JS -->
                    </div>
                    <button onclick="assemblePC()" class="bg-blue-600 text-white px-6 py-2 rounded font-bold">Finalizar Montaje y Calcular Coste</button>
                </div>
            </section>

            <!-- SECCIÓN: VENTAS -->
            <section id="ventas" class="section hidden">
                <div class="bg-white p-6 rounded-lg shadow">
                    <h2 class="text-lg font-bold mb-4">PCs Montados / Por Vender</h2>
                    <div id="lista-pcs" class="space-y-4">
                        <!-- Se llena con JS -->
                    </div>
                </div>
            </section>

        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
